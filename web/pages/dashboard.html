<div class="page-head">
  <div><h1>Dashboard</h1><p>Live figures calculated from your records. <span id="dash-updated" class="muted"></span></p></div>
  <div class="page-actions">
    <select id="dash-city" aria-label="City"><option value="">All cities</option></select>
    <div class="seg" id="dash-range" role="group" aria-label="Period">
      <button data-range="today" class="active">Today</button><button data-range="week">7 days</button><button data-range="month">30 days</button><button data-range="year">Year</button><button data-range="custom">Custom</button>
    </div>
    <span id="dash-custom" class="row" hidden><input type="date" id="dash-from" aria-label="From"><input type="date" id="dash-to" aria-label="To"><button class="btn btn-sm btn-primary" id="dash-apply">Apply</button></span>
    <button class="btn" id="dash-refresh" title="Refresh"><i class="fa-solid fa-rotate"></i></button>
  </div>
</div>
<div id="dash-alerts"></div>
<h4 class="muted" style="margin:4px 0 8px">Right now</h4>
<div id="dash-live" class="stats"></div>
<h4 class="muted" style="margin:4px 0 8px" id="dash-period-title">Selected period</h4>
<div id="dash-period" class="stats"></div>
<div class="grid grid-2-1" style="margin-bottom:16px">
  <section class="card"><div class="card-head"><h3><i class="fa-solid fa-chart-line"></i>Bookings and revenue</h3>
    <div class="seg" id="dash-metric"><button data-metric="bookings" class="active">Bookings</button><button data-metric="revenue">Revenue</button></div></div>
    <div class="card-body"><div class="chart-box"><canvas id="dash-chart" aria-label="Bookings and revenue chart"></canvas></div></div></section>
  <section class="card"><div class="card-head"><h3><i class="fa-solid fa-layer-group"></i>Rides by category</h3></div>
    <div class="card-body"><div class="chart-box"><canvas id="dash-categories" aria-label="Rides by category"></canvas></div></div></section>
</div>
<div class="grid grid-2">
  <section class="card"><div class="card-head"><h3><i class="fa-solid fa-triangle-exclamation"></i>Needs attention</h3></div><div class="card-body flush" id="dash-attention"></div></section>
  <section class="card"><div class="card-head"><h3><i class="fa-solid fa-clock-rotate-left"></i>Recent activity</h3></div><div class="card-body" id="dash-activity" style="max-height:420px;overflow:auto"></div></section>
</div>
