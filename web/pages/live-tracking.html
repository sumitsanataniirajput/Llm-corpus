<div class="page-head">
  <div><h1>Live Vehicle Tracking</h1><p>Positions come from the Driver App. A position is only called “live” while fresh data keeps arriving. <span id="lt-status" class="badge"></span></p></div>
  <div class="page-actions">
    <select id="lt-city" aria-label="City"><option value="">All cities</option></select>
    <label class="check"><input type="checkbox" id="lt-offline"> Show offline</label>
    <label class="check"><input type="checkbox" id="lt-zones" checked> Zones</label>
    <button class="btn" id="lt-fit" title="Fit all vehicles"><i class="fa-solid fa-expand"></i></button>
    <button class="btn" id="lt-refresh" title="Refresh now"><i class="fa-solid fa-rotate"></i></button>
  </div>
</div>
<div id="lt-stats" class="stats"></div>
<div id="lt-notice"></div>
<div class="map-layout">
  <aside class="card">
    <div class="table-toolbar"><div class="tb-search"><i class="fa-solid fa-magnifying-glass"></i><input type="search" id="lt-search" placeholder="Driver, vehicle or booking ID…" aria-label="Search drivers"></div></div>
    <div class="seg" id="lt-filter" style="margin:0 12px 10px"><button data-f="all" class="active">All</button><button data-f="on_ride">On ride</button><button data-f="online">Idle</button><button data-f="problem">Problems</button></div>
    <div id="lt-list" class="map-side"></div>
  </aside>
  <div class="stack">
    <div id="lt-map" class="map"></div>
    <div id="lt-detail"></div>
    <section class="card" data-perm="tracking.view"><div class="card-head"><h3><i class="fa-solid fa-bell"></i>Tracking alerts</h3><span class="muted small">Restricted zones, service-area exits, stale GPS, overspeed</span></div><div class="card-body flush" id="lt-alerts"></div></section>
  </div>
</div>
