<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="CORPUS ULTIMATE — Personal LLM development, training, and monitoring platform">
  <meta name="corpus-build" content="2026-11-20.7">
  <meta name="theme-color" content="#16151a">
  <meta name="color-scheme" content="dark light">
  <title>CORPUS ULTIMATE</title>
  <!-- Warm the connections used on first paint: the API (Render free tier has a
       cold start) and the font/CSS hosts. Cheap, and it removes a full TLS
       handshake from the critical path on mobile and on TV browsers. -->
  <link rel="preconnect" href="https://corpus-ultimate-api.onrender.com" crossorigin>
  <link rel="dns-prefetch" href="https://corpus-ultimate-api.onrender.com">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://avxftwnfuqkyoksjzriu.storage.supabase.co" crossorigin>
  <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
  <link rel="dns-prefetch" href="https://unpkg.com">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Chart.js / SweetAlert2 / Supabase expose globals (window.Chart,
       Swal, supabase) that the app modules below read while they load, so they
       must stay classic, ordered scripts. They are cached aggressively by the
       CDN; `display=swap` on the font link keeps text visible regardless. -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <!-- AOS animations -->
  <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">
  <script src="https://unpkg.com/aos@2.3.4/dist/aos.js" defer></script>
  <!-- Application styles and scripts are versioned with ?v=<buildId> so a
       cached stylesheet can never hide a shipped fix (mobile file picker). -->
  <link rel="stylesheet" href="css/variables.css?v=2026-11-20.7">
  <link rel="stylesheet" href="css/layout.css?v=2026-11-20.7">
  <link rel="stylesheet" href="css/components.css?v=2026-11-20.7">
  <link rel="stylesheet" href="css/pages.css?v=2026-11-20.7">
  <link rel="stylesheet" href="css/responsive.css?v=2026-11-20.7">
</head>
<body>

  <a class="skip-link" href="#main-content">Skip to content</a>

  <!-- Toast container -->
  <div id="toast-container" class="toast-container" role="status" aria-live="polite"></div>

  <!-- Auth modal -->
  <div id="auth-modal" class="modal hidden">
    <div class="modal-backdrop" onclick="auth.closeModal()"></div>
    <div class="modal-content auth-card">
      <button class="modal-close" onclick="auth.closeModal()">&times;</button>
      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login" onclick="auth.switchTab('login')">Sign in</button>
        <button class="auth-tab" data-tab="signup" onclick="auth.switchTab('signup')">Create account</button>
      </div>
      <div id="auth-form-container">
        <!-- forms injected by auth.js -->
      </div>
      <div class="auth-divider"><span>or continue with</span></div>
      <div class="auth-social">
        <button class="social-btn google" id="google-signin"><i class="fab fa-google"></i> Google</button>
        <button class="social-btn github" id="github-signin"><i class="fab fa-github"></i> GitHub</button>
      </div>
      <p class="auth-help" id="auth-reset-link" style="cursor:pointer;">Forgot password?</p>
    </div>
  </div>

  <!-- Offline indicator -->
  <div id="offline-banner" class="offline-banner hidden">
    <i class="fas fa-wifi"></i>
    <span>You are offline. Some features are unavailable.</span>
  </div>

  <!-- Connection indicator -->
  <div id="connection-indicator" class="connection-indicator hidden">
    <i class="fas fa-circle text-success"></i>
    <span id="connection-text">Connected</span>
  </div>

  <!-- Top app bar — present at every size; the hamburger is the only
       navigation control in the app (no bottom bar, no floating duplicates). -->
  <header class="app-bar" role="banner">
    <button class="menu-toggle" id="menu-toggle" type="button"
            aria-label="Open menu" aria-controls="sidebar" aria-expanded="false">
      <i class="fas fa-bars" aria-hidden="true"></i>
    </button>
    <div class="app-bar-title">
      <div class="app-logo">
        <i class="fas fa-brain"></i>
        <span>CORPUS</span>
      </div>
      <div class="app-bar-subtitle">ULTIMATE</div>
    </div>
    <div class="app-bar-actions">
      <button class="icon-btn" id="notifications-btn" aria-label="Notifications">
        <i class="fas fa-bell"></i>
        <span class="badge" id="notification-badge">0</span>
      </button>
      <button class="icon-btn" id="user-profile-btn" aria-label="User profile">
        <i class="fas fa-user-circle"></i>
      </button>
    </div>
  </header>

  <!-- Navigation drawer (every screen size, opened by the hamburger).
       Sections and items are rendered from js/routes.js by router.js. -->
  <aside class="sidebar hidden" id="sidebar" aria-label="Main navigation"
         aria-hidden="true" tabindex="-1" inert>
    <div class="sidebar-header">
      <div class="app-logo">
        <i class="fas fa-brain" aria-hidden="true"></i>
        <span>CORPUS ULTIMATE</span>
      </div>
      <button class="sidebar-close" id="sidebar-close" type="button" aria-label="Close menu">
        <i class="fas fa-times" aria-hidden="true"></i>
      </button>
    </div>
    <nav class="sidebar-nav" id="sidebar-nav" aria-label="Sections">
      <!-- grouped navigation injected by router.js from CORPUS_ROUTES -->
    </nav>
    <div class="sidebar-footer">
      <div class="user-info" id="sidebar-user-info" style="display:none;">
        <div class="user-avatar" id="sidebar-user-avatar"></div>
        <div class="user-meta">
          <div class="user-name" id="sidebar-user-name">User</div>
          <div class="user-email" id="sidebar-user-email">user@example.com</div>
        </div>
      </div>
      <button class="nav-item logout-btn" id="sidebar-logout" style="display:none;">
        <i class="fas fa-sign-out-alt"></i>
        <span>Sign out</span>
      </button>
    </div>
  </aside>

  <!-- Drawer scrim: tapping outside the menu closes it -->
  <div class="sidebar-overlay hidden" id="sidebar-overlay" aria-hidden="true"></div>

  <!-- Main content -->
  <main class="main-content" id="main-content" tabindex="-1">
    <!-- Page container -->
    <div class="page-container" id="page-container">
      <!-- Pages injected by router.js -->
    </div>
  </main>

  <!-- Confirmation dialog -->
  <div id="confirm-dialog" class="modal hidden">
    <div class="modal-backdrop" onclick="ui.closeConfirm()"></div>
    <div class="modal-content confirm-card">
      <div class="confirm-header">
        <h3 id="confirm-title">Confirm action</h3>
        <button class="modal-close" onclick="ui.closeConfirm()">&times;</button>
      </div>
      <p id="confirm-message">Are you sure?</p>
      <div class="confirm-actions">
        <button class="btn btn-outline" onclick="ui.closeConfirm()">Cancel</button>
        <button class="btn btn-danger" id="confirm-ok">OK</button>
      </div>
    </div>
  </div>

  <!-- Application JavaScript -->
  <script src="js/config.js?v=2026-11-20.7" defer></script>
  <script src="js/utils.js?v=2026-11-20.7" defer></script>
  <script src="js/perf.js?v=2026-11-20.7" defer></script>
  <script src="js/supabase-client.js?v=2026-11-20.7" defer></script>
  <script src="js/api.js?v=2026-11-20.7" defer></script>
  <script src="js/auth.js?v=2026-11-20.7" defer></script>
  <script src="js/state.js?v=2026-11-20.7" defer></script>
  <script src="js/components.js?v=2026-11-20.7" defer></script>
  <script src="js/actions.js?v=2026-11-20.7" defer></script>
  <script src="js/charts.js?v=2026-11-20.7" defer></script>
  <script src="js/app-context.js?v=2026-11-20.7" defer></script>
  <script src="js/routes.js?v=2026-11-20.7" defer></script>
  <script src="js/router.js?v=2026-11-20.7" defer></script>
  <script src="js/dashboard.js?v=2026-11-20.7" defer></script>
  <script src="js/models.js?v=2026-11-20.7" defer></script>
  <script src="js/training.js?v=2026-11-20.7" defer></script>
  <script src="js/statistics.js?v=2026-11-20.7" defer></script>
  <script src="js/chat.js?v=2026-11-20.7" defer></script>
  <script src="js/prediction.js?v=2026-11-20.7" defer></script>
  <script src="js/neural-lab.js?v=2026-11-20.7" defer></script>
  <script src="js/ai-information.js?v=2026-11-20.7" defer></script>
  <script src="js/datasets.js?v=2026-11-20.7" defer></script>
  <script src="js/evaluation.js?v=2026-11-20.7" defer></script>
  <script src="js/compute.js?v=2026-11-20.7" defer></script>
  <script src="js/device-agent.js?v=2026-11-20.7" defer></script>
  <script src="js/devices.js?v=2026-11-20.7" defer></script>
  <script src="js/storage.js?v=2026-11-20.7" defer></script>
  <script src="js/experiments.js?v=2026-11-20.7" defer></script>
  <script src="js/settings.js?v=2026-11-20.7" defer></script>
  <script src="js/teachers.js?v=2026-11-20.7" defer></script>
  <script src="js/teacher-selection.js?v=2026-11-20.7" defer></script>
  <script src="js/distillation.js?v=2026-11-20.7" defer></script>
  <script src="js/students.js?v=2026-11-20.7" defer></script>
  <script src="js/intelligence.js?v=2026-11-20.7" defer></script>
  <script src="js/budgets.js?v=2026-11-20.7" defer></script>
  <script src="js/app-bootstrap.js?v=2026-11-20.7" defer></script>
</body>
</html>
