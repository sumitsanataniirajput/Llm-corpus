# ========================================
# CORPUS ULTIMATE — Docker Compose
# ========================================
version: "3.8"

services:
  corpus-backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped